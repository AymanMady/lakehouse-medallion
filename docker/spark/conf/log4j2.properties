# Keep Spark's own chatter at WARN so our job logs stay readable.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n

# Our own jobs log at INFO
logger.lakehouse.name = lakehouse
logger.lakehouse.level = info

logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = error
# S3A dumps a multi-line block of upload statistics at WARN every time a
# stream closes. It says nothing useful here and drowns the job's own output.
logger.s3a.name = org.apache.hadoop.fs.s3a
logger.s3a.level = error
logger.datanucleus.name = DataNucleus
logger.datanucleus.level = error
logger.hive.name = org.apache.hadoop.hive
logger.hive.level = error
logger.hivemeta.name = hive.metastore
logger.hivemeta.level = error
